<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Dijkstra – shortest path</title>
<style>
    :root {
        --bg1: #eef2f8;
        --bg2: #dfe7f3;
        --card: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --border: #e2e8f0;
        --accent: #4f46e5;

        --unreached: #cbd5e1;
        --queue: #60a5fa;
        --current: #f59e0b;
        --visited: #34d399;
        --path: #e11d48;
        --better: #10b981;
        --worse: #f43f5e;
        --tree: #93c5fd;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 24px;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: linear-gradient(160deg, var(--bg1), var(--bg2));
        min-height: 100vh;
    }

    header { margin-bottom: 16px; }
    header h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
    header p { margin: 4px 0 0; color: var(--muted); }

    .card {
        background: var(--card);
        border-radius: 14px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .08);
        padding: 14px 16px;
    }
    .card h3 {
        margin: 0 0 10px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
    }

    #toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
    }
    #toolbar label { font-size: 13px; color: var(--muted); font-weight: 600; }
    .group { display: flex; align-items: center; gap: 6px; }
    .spacer { flex: 1; }

    select, button {
        font: inherit;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        padding: 6px 12px;
        background: #f8fafc;
        color: var(--text);
        cursor: pointer;
        transition: background .15s, transform .05s, box-shadow .15s;
    }
    select:hover, button:hover:not(:disabled) { background: #eef2ff; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .4; cursor: default; }
    button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
        box-shadow: 0 2px 8px rgba(79, 70, 229, .35);
    }
    button.primary:hover:not(:disabled) { background: #4338ca; }
    input[type=range] { accent-color: var(--accent); width: 90px; }

    #progress {
        flex-basis: 100%;
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
    }
    #progressBar {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent), #8b5cf6);
        transition: width .3s ease;
    }
    #stepLabel { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

    #wrap { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    #mapCard { padding: 8px; }
    #side { width: 360px; display: flex; flex-direction: column; gap: 16px; }

    svg { display: block; border-radius: 10px; }
    .edge { stroke: var(--unreached); stroke-width: 3; stroke-linecap: round;
            transition: stroke .35s, stroke-width .35s; }
    .edge.tree { stroke: var(--tree); stroke-width: 5; }
    .edge.better { stroke: var(--better); stroke-width: 8; }
    .edge.worse { stroke: var(--worse); stroke-width: 8; stroke-dasharray: 10 8; }
    .edge.path { stroke: var(--path); stroke-width: 8; stroke-dasharray: 14 10;
                 animation: flow 0.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }

    .arrow { fill: var(--unreached); transition: fill .35s; }
    .arrow.tree { fill: var(--tree); }
    .arrow.better { fill: var(--better); }
    .arrow.worse { fill: var(--worse); }
    .arrow.path { fill: var(--path); }

    .weight rect { fill: white; stroke: var(--border); }
    .weight text { font-size: 12px; fill: var(--muted); font-weight: 600; }

    .node circle.body { fill: var(--unreached); stroke: white; stroke-width: 4;
                        transition: fill .35s; filter: url(#shadow); }
    .node.queue circle.body { fill: var(--queue); }
    .node.visited circle.body { fill: var(--visited); }
    .node.current circle.body { fill: var(--current); }
    .node.path circle.body { fill: var(--path); }

    .node circle.ring { fill: none; stroke: var(--current); stroke-width: 3; opacity: 0; }
    .node.current circle.ring { animation: pulse 1.2s ease-out infinite; }
    @keyframes pulse {
        from { opacity: .9; r: 26px; }
        to   { opacity: 0;  r: 42px; }
    }

    .node .dist { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .node.path .dist, .node.current .dist { fill: white; }
    .node .name {
        font-size: 14px; font-weight: 600; fill: var(--text);
        paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round;
    }
    .node .tag { font-size: 11px; font-weight: 700; fill: var(--accent); letter-spacing: 1px; }

    #legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 8px 4px; font-size: 13px; color: var(--muted); }
    #legend span.noDot::before { display: none; }
    #legend span::before {
        content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%;
        margin-right: 6px; vertical-align: -1px; background: var(--c);
    }

    #msg {
        border-left: 4px solid var(--accent);
        padding: 8px 12px;
        background: #f8fafc;
        border-radius: 0 8px 8px 0;
        font-size: 14px;
        line-height: 1.45;
        min-height: 64px;
        transition: border-color .3s;
    }
    #msg.poll { border-color: var(--current); }
    #msg.better { border-color: var(--better); }
    #msg.worse, #msg.skip { border-color: var(--worse); }
    #msg.done, #msg.stop { border-color: var(--path); }

    #queue { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
    .chip {
        padding: 4px 10px;
        border-radius: 999px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 600;
    }
    .chip.next { background: var(--current); border-color: var(--current); color: white; }
    .chip.stale { opacity: .45; text-decoration: line-through; }
    .empty { color: var(--muted); font-size: 13px; font-style: italic; }

    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 6px; }
    td { padding: 5px 6px; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    tr.visited td:first-child { color: #059669; font-weight: 600; }
    tr.changed td { background: #ecfdf5; }
    tr.changed td:nth-child(2) { color: #059669; font-weight: 700; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--c); }

    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    kbd { background: #f1f5f9; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
<link rel="stylesheet" href="../embed.css">
</head>
<body>
<header>
    <h1>Dijkstra's algorithm</h1>
    <p>Shortest route between cities on Zealand (directed, weighted roads), step by step</p>
</header>
<script src="Visual.js"></script>
<script src="../embed.js"></script>
</body>
</html>
