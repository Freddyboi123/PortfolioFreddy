name: Sync posts to Dify

on:
  push:
    branches: [main]
    paths: ['content/posts/**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-dify-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Create or update changed posts in Dify
        env:
          DIFY_BASE_URL: ${{ vars.DIFY_BASE_URL }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_DATASET_ID: ${{ vars.DIFY_DATASET_ID }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = await import('node:child_process');
          const { readFile } = await import('node:fs/promises');
          const { relative, resolve } = await import('node:path');

          for (const name of ['DIFY_BASE_URL', 'DIFY_API_KEY', 'DIFY_DATASET_ID']) {
            if (!process.env[name]) throw new Error(`GitHub Actions ${name} is not set.`);
          }

          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).split('\n').filter(Boolean);
          const files = process.env.EVENT_NAME === 'workflow_dispatch'
            ? git('ls-files', 'content/posts')
            : git('diff', '--name-only', '--diff-filter=ACMR', process.env.BEFORE_SHA, process.env.CURRENT_SHA, '--', 'content');

          const markdownFiles = files.filter(file => file.endsWith('.md'));
          if (!markdownFiles.length) process.exit(0);

          const baseUrl = process.env.DIFY_BASE_URL.replace(/\/$/, '');
          const datasetUrl = `${baseUrl}/v1/datasets/${process.env.DIFY_DATASET_ID}`;
          const headers = {
            Authorization: `Bearer ${process.env.DIFY_API_KEY}`,
            'Content-Type': 'application/json'
          };
          const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

          async function request(url, options) {
            const response = await fetch(url, options);
            const text = await response.text();
            if (!response.ok) throw new Error(`Dify returned ${response.status}: ${text}`);
            return text ? JSON.parse(text) : null;
          }

          for (const file of markdownFiles) {
            const sourcePath = relative(process.cwd(), resolve(file)).replaceAll('\\', '/');
            const fileName = sourcePath.split('/').pop();
            const lastDot = fileName.lastIndexOf('.');
            const baseName = fileName.slice(0, lastDot);
            const extension = fileName.slice(lastDot);
            const folder = sourcePath
              .split('/')
              .slice(0, -1)
              .join('/')
              .replace(/^content\/posts\/?/, '');
            const name = folder ? `${baseName} (${folder})${extension}` : fileName;

            const documents = await request(
              `${datasetUrl}/documents?keyword=${encodeURIComponent(fileName)}&limit=100`,
              { headers }
            );
            const existing = documents.data.find(
              document => document.name === name || document.name === sourcePath
            );
            const url = existing
              ? `${datasetUrl}/documents/${existing.id}/update-by-text`
              : `${datasetUrl}/document/create-by-text`;

            await request(url, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                name,
                text: await readFile(file, 'utf8'),
                indexing_technique: 'high_quality'
              })
            });
            console.log(`${existing ? 'Updated' : 'Created'}: ${name}`);
            // Dify Cloud limits Knowledge Base API requests on this subscription.
            await wait(7000);
          }
          NODE